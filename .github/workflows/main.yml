name: Generate Stats Images

on:
  push:
    branches:
      - master
  schedule:
    - cron: "28 4 * * *"
  workflow_dispatch:
    inputs:
      reset_history:
        description: "Recréer la branche generated sans historique (branche orpheline, push forcé)"
        type: boolean
        default: false

permissions:
  contents: read

# Deux exécutions simultanées partiraient du même état de generated :
# la seconde attend la fin de la première au lieu d'échouer au push.
concurrency:
  group: generate-stats
  cancel-in-progress: false

defaults:
  run:
    shell: bash -euxo pipefail {0}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0

      - name: Build
        run: |
          zig build

      - name: Generate images
        run: |
          mkdir -p "$OUTPUT_DIR"
          ./zig-out/bin/github-stats \
            --overview-output-file "$OUTPUT_DIR/overview.svg" \
            --languages-output-file "$OUTPUT_DIR/languages.svg" \
            --public-json-output-file "$OUTPUT_DIR/portfolio.json"
        env:
          OUTPUT_DIR: ${{ runner.temp }}/output
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          EXCLUDE_REPOS: ${{ secrets.EXCLUDE_REPOS }}
          EXCLUDE_LANGS: ${{ secrets.EXCLUDE_LANGS }}
          EXCLUDE_PRIVATE: "false"
          SILENT: "true"
          # TODO: Remove this when they get their API working again
          # https://github.com/orgs/community/discussions/192970
          MAX_RETRIES: 5
          # Dump complet (e-mails, dépôts privés, vues) : hors du dépôt, jamais publié,
          # seulement lu par les garde-fous de l'étape suivante.
          JSON_OUTPUT_FILE: ${{ runner.temp }}/stats.json

      # portfolio.json est lu au build de eliott-roussille.fr (sans token) : uniquement des
      # agrégats publics, calculés par le binaire avec les mêmes exclusions que les images.
      - name: Check portfolio.json
        env:
          FULL: ${{ runner.temp }}/stats.json
          OUT: ${{ runner.temp }}/output/portfolio.json
        run: |
          # Garde-fou : aucune clé en plus, aucun nom de dépôt privé, aucune donnée privée.
          jq -e 'keys == ["contributions","generatedAt","languages","linesChanged","repoCount","repositories","stars"]' "$OUT"
          jq -e --slurpfile full "$FULL" \
            '([$full[0].repositories[] | select(.private) | .name]) as $priv
             | [.repositories[].name] | all(. as $n | $priv | index($n) | not)' \
            "$OUT"
          if grep -qiE '"(emails|views|user)"' "$OUT"; then
            echo "portfolio.json contient une donnée privée" >&2
            exit 1
          fi
          rm -f "$FULL"

      # La branche generated ne contient que les sorties : elle est remplie depuis un
      # worktree séparé, sans rien copier du dossier de travail de master.
      - name: Publish to the generated branch
        env:
          OUTPUT_DIR: ${{ runner.temp }}/output
          BRANCH_DIR: ${{ runner.temp }}/generated
          RESET_HISTORY: ${{ inputs.reset_history || false }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [[ "$RESET_HISTORY" != "true" ]] \
            && git ls-remote --exit-code --heads origin generated; then
            git fetch --depth=1 --no-tags origin +refs/heads/generated:refs/remotes/origin/generated
            git worktree add -B generated "$BRANCH_DIR" origin/generated
            push_args=()
          else
            git worktree add --orphan -b generated "$BRANCH_DIR"
            push_args=(--force)
          fi

          cd "$BRANCH_DIR"
          git rm -r --quiet --ignore-unmatch -- .
          cp "$OUTPUT_DIR/overview.svg" "$OUTPUT_DIR/languages.svg" "$OUTPUT_DIR/portfolio.json" .
          # Ancien chemin, encore lu par aust-1/portfolio : à supprimer une fois le site
          # passé à https://raw.githubusercontent.com/aust-1/github-stats/generated/portfolio.json
          mkdir -p generated
          cp "$OUTPUT_DIR/portfolio.json" generated/portfolio.json
          cat > README.md <<'EOF'
          # github-stats : fichiers générés

          Cette branche est écrite chaque jour par le workflow « Generate Stats Images »
          de [`master`](https://github.com/aust-1/github-stats/tree/master), qui contient le code
          et la documentation. Ne pas la modifier à la main.

          | Fichier | Contenu |
          | ------- | ------- |
          | [`overview.svg`](https://github.com/aust-1/github-stats/blob/generated/overview.svg) | Vue d'ensemble des statistiques |
          | [`languages.svg`](https://github.com/aust-1/github-stats/blob/generated/languages.svg) | Langages les plus utilisés |
          | [`portfolio.json`](https://raw.githubusercontent.com/aust-1/github-stats/generated/portfolio.json) | Agrégats publics lus par eliott-roussille.fr |
          | `generated/portfolio.json` | Copie temporaire de `portfolio.json` à l'ancien chemin |
          EOF

          git add --all
          # Pas de commit vide si rien n'a changé
          if git diff --cached --quiet; then
            echo "Aucun changement"
          else
            git commit --quiet -m "Update generated files"
          fi
          git push "${push_args[@]}" origin generated
